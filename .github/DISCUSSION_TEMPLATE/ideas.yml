title: "[Prompt Garden Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Share a prompt, one image, multiple effect images, links, or a loose idea.

        这里是 Prompt Garden 的轻量投稿入口。你可以只贴提示词、只上传图片，或同时提供提示词和多张效果图。

        Prompt Garden may review, rewrite, abstract, or ignore submissions. Accepted content is curated manually in the private Prompt Garden source.
  - type: textarea
    id: contribution
    attributes:
      label: Submission / 投稿内容
      description: "Paste prompt text, describe images, add links, or drag images into the editor after the discussion page opens. 可以中英文混合填写，不完整也可以提交。"
      placeholder: |
        Paste a prompt, describe the image/style, add links, or explain the reusable idea.

        You can also attach one or more images directly in the GitHub editor.

        中文也可以：贴提示词、描述图片/风格、补充链接，或说明你觉得可复用的创意。
    validations:
      required: false
  - type: input
    id: model-tool
    attributes:
      label: Model or tool / 模型或工具
      description: "Optional. Example: Midjourney, Seedream, ChatGPT, Claude, Stable Diffusion."
      placeholder: Optional
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes / 备注
      description: "Optional. Anything useful for curation, such as what worked, what failed, or what you want this to become."
      placeholder: Optional
    validations:
      required: false
